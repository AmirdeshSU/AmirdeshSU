name: Update stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stats.svg
        env:
          # PAT with read:user; the default GITHUB_TOKEN cannot see private contributions.
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python3 .github/scripts/stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git diff --cached --quiet || (git commit -m "chore: update stats" && git push)
